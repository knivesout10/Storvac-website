<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — StorVac Logistics</title>
<link rel="icon" type="image/png" href="/assets/logo-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="container">
    <h1>My Bookings</h1>

    <div id="not-logged-in" class="card" style="display:none;">
      <p>Please log in to view your bookings.</p>
      <a href="/login.html" class="btn btn-primary">Log In</a>
    </div>

    <div id="bookings-list"></div>
    <div id="empty-state" class="card" style="display:none;">
      <p>You have no bookings yet.</p>
      <a href="/book.html" class="btn btn-primary">Book Storage</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="/js/common.js"></script>
<script src="/js/mybookings.js"></script>
</body>
</html>
