<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — StorVac Logistics</title>
<link rel="icon" type="image/png" href="/assets/logo-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="container" style="max-width: 420px;">
    <h1>Log in</h1>
    <div class="card">
      <form id="login-form">
        <div id="error-slot"></div>

        <label for="identifier">Phone Number or Email</label>
        <input type="text" id="identifier" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Log In</button>
      </form>
      <p style="margin-top:16px; font-size:0.9rem;">New here? <a href="/signup.html">Create an account</a></p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
