<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — StorVac Logistics</title>
<link rel="icon" type="image/png" href="/assets/logo-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="container" style="max-width: 480px;">
    <h1>Create your account</h1>
    <div class="card">
      <form id="signup-form">
        <div id="error-slot"></div>

        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 0244000000" required>
        <p class="field-help">Your booking codes and payment receipts are sent to this number by SMS.</p>

        <label for="email">Email (optional)</label>
        <input type="email" id="email">
        <p class="field-help">Not required — SMS is how you'll receive your receipts.</p>

        <label for="institution">Institution</label>
        <select id="institution" required>
          <option value="">Select your institution</option>
          <option>University of Ghana</option>
          <option>UPSA</option>
          <option>Knutsford University College</option>
          <option>Wisconsin University College</option>
        </select>

        <label for="hall">Hall / Hostel of Residence</label>
        <input type="text" id="hall" required>

        <label for="room">Room Number</label>
        <input type="text" id="room" required>

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" required minlength="6">

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Sign Up</button>
      </form>
      <p style="margin-top:16px; font-size:0.9rem;">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
